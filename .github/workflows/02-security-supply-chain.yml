name: Security Supply Chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6 # ALLOW_VERSION_TAGS_DURING_BOOTSTRAP
      - uses: actions/setup-python@v6 # ALLOW_VERSION_TAGS_DURING_BOOTSTRAP
        with:
          python-version: "3.x"
      - run: python3 -m pip install -r requirements-ci.txt
      - name: Install pinned Rust security tools (no application dependencies)
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0 ALLOW_VERSION_TAGS_DURING_BOOTSTRAP
        with:
          tool: |
            cargo-deny@0.20.2
            cargo-audit@0.22.2
          fallback: none
      - run: bash scripts/security_policy_check.sh
      - run: bash scripts/actions_security_gate.sh
      - run: bash scripts/supply_chain_gate.sh
